# Minimal Envoy edge proxy for a grpcmux server (local testing without
# Kubernetes): run the example server, then `envoy -c envoy.yaml`, and call
# http://127.0.0.1:9080 with REST, Connect, gRPC-Web or gRPC.
#
# No transcoding or gRPC-Web filter is needed: the grpcmux HTTP port already
# serves REST, Connect and gRPC-Web. Envoy only has to forward over HTTP/2
# (h2c) and leave streaming responses unbuffered and without a route timeout.
admin:
  address:
    socket_address: { address: 127.0.0.1, port_value: 9901 }

static_resources:
  listeners:
    - name: edge
      address:
        socket_address: { address: 0.0.0.0, port_value: 9080 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: edge
                codec_type: AUTO # HTTP/1.1 and HTTP/2 from clients
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: userservice
                      domains: ["*"]
                      routes:
                        # Streaming endpoints: no route timeout.
                        - match: { path: "/v1/users:export" }
                          route: { cluster: grpcmux, timeout: 0s }
                        - match: { path: "/example.user.v1.UserService/ExportUsers" }
                          route: { cluster: grpcmux, timeout: 0s }
                        - match: { prefix: "/" }
                          route: { cluster: grpcmux, timeout: 30s }
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: grpcmux
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {} # h2c to the grpcmux HTTP port
      load_assignment:
        cluster_name: grpcmux
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: 127.0.0.1, port_value: 8080 }
      health_checks:
        - timeout: 2s
          interval: 5s
          unhealthy_threshold: 1
          healthy_threshold: 2
          http_health_check: { path: /readyz }
